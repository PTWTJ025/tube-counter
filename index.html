<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>นับหลอดด้าย - Tube Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F7;
    --surface:#FFFFFF;
    --surface-alt:#F1F3F5;
    --border:#DDE1E4;
    --border-strong:#C7CDD3;
    --text:#14181C;
    --text-muted:#5B6570;
    --accent:#2C5CC5;
    --accent-hover:#234A9E;
    --accent-tint:#E8EEFB;
    --danger:#C4453A;
    --danger-tint:#FBEAE8;
    --success:#2F8F5B;
    --success-tint:#E7F4ED;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:12px;
    --shadow-sm:0 1px 2px rgba(20,24,28,0.06);
    --shadow-md:0 4px 10px rgba(20,24,28,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:540px;
    margin:0 auto;
    padding:16px 16px 48px;
  }
  header.top{
    padding:18px 2px 20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .top-text h1{
    font-size:21px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .top-text p{
    font-size:13.5px;
    color:var(--text-muted);
    margin:0;
    line-height:1.5;
  }
  .storage-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    padding:4px 8px;
    border-radius:var(--radius-sm);
    background:var(--accent-tint);
    color:var(--accent-hover);
    font-weight:600;
    white-space:nowrap;
  }
  .storage-badge .dot{
    width:6px; height:6px; border-radius:50%; background:currentColor;
  }

  /* ---- Card primitive ---- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);
  }

  /* ---- Camera / capture panel ---- */
  .capture-panel{
    overflow:hidden;
    margin-bottom:16px;
  }
  .viewfinder{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    background:#0E1114;
    overflow:hidden;
    user-select:none;
  }
  .viewfinder video,
  .viewfinder canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .viewfinder canvas#overlayCanvas{
    object-fit:contain;
    background:#0E1114;
    cursor:crosshair;
  }
  .viewfinder .state-msg{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:#C6CDD4;
    font-size:13.5px;
    text-align:center;
    padding:24px;
    z-index:5;
  }
  .spinner{
    width:22px;height:22px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.25);
    border-top-color:#fff;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .count-chip{
    position:absolute;
    top:12px; left:12px;
    background:rgba(14,17,20,0.80);
    color:#fff;
    padding:6px 14px;
    border-radius:var(--radius-sm);
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
    backdrop-filter:blur(4px);
    z-index:10;
    border:1px solid rgba(255,255,255,0.15);
  }
  .count-chip .dot{
    width:6px;height:6px;border-radius:50%;
    background:#4ADE80;
  }

  .canvas-tip{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.78);
    color:#e2e8f0;
    font-size:11.5px;
    padding:4px 10px;
    border-radius:20px;
    pointer-events:none;
    z-index:10;
    white-space:nowrap;
  }

  .capture-controls{
    padding:12px 14px;
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
  }

  /* ---- Buttons ---- */
  button{
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    border-radius:var(--radius-md);
    border:1px solid transparent;
    cursor:pointer;
    padding:11px 16px;
    transition:background .12s ease, border-color .12s ease, transform .04s ease;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    flex:1;
  }
  .btn-primary:hover:not(:disabled){background:var(--accent-hover);}
  .btn-secondary{
    background:var(--surface);
    color:var(--text);
    border-color:var(--border-strong);
  }
  .btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
  .btn-ghost{
    background:transparent;
    color:var(--text-muted);
    border-color:transparent;
    padding:6px 10px;
    font-size:13px;
  }
  .btn-ghost:hover{background:var(--surface-alt); color:var(--text);}
  .btn-danger-ghost{
    background:transparent;
    color:var(--danger);
    border-color:transparent;
    padding:6px 8px;
    font-size:12.5px;
  }
  .btn-danger-ghost:hover{background:var(--danger-tint);}

  /* ---- Inline error banner ---- */
  .banner{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:var(--danger-tint);
    border:1px solid #EFC3BE;
    color:#8A2E26;
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.5;
    margin-bottom:16px;
  }
  .banner button{
    margin-top:6px;
    background:#fff;
    border:1px solid #EFC3BE;
    color:#8A2E26;
    padding:6px 12px;
    font-size:13px;
  }

  /* ---- Result / save form ---- */
  .result-panel{
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:13px;
    font-weight:600;
    color:var(--text-muted);
  }
  .count-editor{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .count-editor button{
    width:42px; height:42px;
    padding:0;
    font-size:20px;
    background:var(--surface-alt);
    border:1px solid var(--border-strong);
    color:var(--text);
    flex:none;
    border-radius:var(--radius-sm);
  }
  .count-editor input{
    width:100%;
    text-align:center;
    font-size:24px;
    font-weight:700;
    padding:8px 6px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
  }
  select, input[type="text"]{
    font-family:inherit;
    font-size:14.5px;
    padding:10px 12px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    background:var(--surface);
    color:var(--text);
  }
  select:focus, input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .slider-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .slider-row input[type="range"]{
    flex:1;
    accent-color:var(--accent);
    height:6px;
  }
  .slider-hint{
    font-size:12px;
    color:var(--text-muted);
    display:flex;
    justify-content:space-between;
    margin-top:2px;
  }
  .form-actions{
    display:flex;
    gap:10px;
  }

  /* ---- History section ---- */
  .history{
    margin-top:24px;
  }
  .history-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    padding:0 2px;
  }
  .history-header h2{
    font-size:15.5px;
    font-weight:700;
    margin:0;
  }
  .history-header-actions{
    display:flex;
    gap:4px;
  }
  .summary-chips{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .summary-chip{
    background:var(--accent-tint);
    color:var(--accent-hover);
    border-radius:var(--radius-sm);
    padding:8px 12px;
    font-size:13px;
    flex:1;
  }
  .summary-chip strong{
    display:block;
    font-size:18px;
    font-weight:700;
    margin-top:2px;
  }
  .history-list{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }
  .history-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-top:1px solid var(--border);
  }
  .history-row:first-child{border-top:none;}
  .history-row img{
    width:48px; height:48px;
    object-fit:cover;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    flex:none;
    background:var(--surface-alt);
  }
  .history-row .meta{
    flex:1;
    min-width:0;
  }
  .history-row .meta .type{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .history-row .meta .time{
    font-size:12px;
    color:var(--text-muted);
    margin-top:1px;
  }
  .history-row .count-badge{
    font-size:16px;
    font-weight:700;
    color:var(--accent);
    flex:none;
    min-width:38px;
    text-align:right;
  }
  .empty-state{
    padding:34px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13.5px;
    line-height:1.6;
  }
  .empty-state .icon{
    font-size:26px;
    margin-bottom:6px;
  }

  /* ---- Toast ---- */
  #toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(12px);
    background:var(--text);
    color:#fff;
    padding:11px 18px;
    border-radius:var(--radius-sm);
    font-size:13.5px;
    font-weight:600;
    box-shadow:var(--shadow-md);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:50;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #toast .dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ---- Lucide Icons ---- */
  .lucide{
    width:17px; height:17px;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    flex-shrink:0;
    vertical-align:middle;
  }
  .btn-primary .lucide, .btn-secondary .lucide { width:16px; height:16px; }

  /* ---- OpenCV Notice Banner ---- */
  .opencv-notice{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:rgba(245,158,11,0.08);
    border:1px solid rgba(245,158,11,0.25);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    margin:0 0 12px;
    font-size:13px;
    line-height:1.6;
    color:var(--text);
  }
  .opencv-notice .icon-wrap{
    color:#f59e0b;
    flex-shrink:0;
    margin-top:1px;
  }
  .opencv-notice strong{ color:#f59e0b; }
  .opencv-notice a{ color:var(--accent); text-decoration:none; }

  @media (prefers-reduced-motion: reduce){
    .spinner{animation:none;}
    #toast{transition:none;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-text">
      <h1>นับหลอดด้าย</h1>
      <p>ถ่ายรูปหลอดด้ายในตะกร้าด้วยกล้อง แล้วระบบจะนับจำนวนให้อัตโนมัติ — แตะบนรูปเพื่อปรับแก้ได้</p>
    </div>
    <div class="storage-badge" id="storageBadge">
      <span class="dot"></span>
      <span id="storageBadgeText">JSON Store</span>
    </div>
  </header>

  <div id="bannerSlot"></div>



  <section class="card capture-panel">
    <div class="viewfinder" id="viewfinder">
      <canvas id="captureCanvas" style="display:none;"></canvas>
      <canvas id="overlayCanvas" style="display:none;"></canvas>
      <div class="state-msg" id="cameraState">
        <i data-lucide="camera" style="width:40px;height:40px;opacity:.3;"></i>
        <span style="color:var(--text-muted);font-size:13px;margin-top:4px;">กด "ถ่ายรูป" หรือ "เลือกจากคลัง" ด้านล่าง</span>
      </div>
      <div class="count-chip" id="countChip" style="display:none;">
        <span class="dot"></span>
        <span id="countChipText">นับได้ 0 หลอด</span>
      </div>
    </div>
    <div class="capture-controls" id="captureControls" style="display:flex;">
      <!-- Native camera capture -->
      <label class="btn-primary" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border-radius:8px;">
        <i data-lucide="camera"></i> ถ่ายรูป
        <input type="file" id="cameraCapture" accept="image/*" capture="environment" style="display:none;">
      </label>
      <label class="btn-secondary" style="flex:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:11px 14px;gap:7px;border-radius:8px;">
        <i data-lucide="image-up"></i> เลือกจากคลัง
        <input type="file" id="fileUpload" accept="image/*" style="display:none;">
      </label>
    </div>
  </section>

  <section class="card result-panel" id="resultPanel" style="display:none;">
    <div class="field">
      <label for="countInput">จำนวนที่นับได้ (กด +/- เพื่อแก้ไขหาก AI นับพลาด)</label>
      <div class="count-editor">
        <button type="button" id="btnMinus" aria-label="ลดจำนวน">−</button>
        <input type="number" id="countInput" min="0" value="0">
        <button type="button" id="btnPlus" aria-label="เพิ่มจำนวน">+</button>
      </div>
    </div>



    <div class="field">
      <label for="typeSelect">ประเภทความเสียหายของหลอดด้าย</label>
      <select id="typeSelect">
        <option value="ใยพันทับ">ใยพันทับ</option>
        <option value="ใยกระแทก">ใยกระแทก</option>
        <option value="ใยลุ่ย">ใยลุ่ย</option>
        <option value="ใยสองเส้น">ใยสองเส้น</option>
        <option value="ใยแตกปลาย">ใยแตกปลาย</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>

    <div class="field" id="customTypeField" style="display:none;">
      <label for="customType">ระบุประเภท</label>
      <input type="text" id="customType" placeholder="พิมพ์ชื่อประเภท...">
    </div>

    <div class="form-actions">
      <button class="btn-secondary" id="btnRetake" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;">
        <i data-lucide="rotate-ccw"></i> ถ่ายใหม่
      </button>
      <button class="btn-primary" id="btnSave" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;">
        <i data-lucide="save"></i> บันทึก
      </button>
    </div>
  </section>

  <section class="history">
    <div class="history-header">
      <h2>ประวัติการนับ</h2>
      <div class="history-header-actions">
        <button class="btn-ghost" id="btnExportJson" style="display:inline-flex;align-items:center;gap:5px;">
          <i data-lucide="file-json"></i> ส่งออก JSON
        </button>
        <button class="btn-ghost" id="btnExportCsv" style="display:inline-flex;align-items:center;gap:5px;">
          <i data-lucide="file-spreadsheet"></i> ส่งออก CSV
        </button>
      </div>
    </div>

    <div class="summary-chips" id="summaryChips" style="display:none;">
      <div class="summary-chip">จำนวนครั้งที่บันทึก<strong id="sumEntries">0</strong></div>
      <div class="summary-chip">รวมหลอดทั้งหมด<strong id="sumTotal">0</strong></div>
    </div>

    <div class="history-list" id="historyList">
      <div class="empty-state">
        <div class="icon"><i data-lucide="circle-dashed" style="width:28px;height:28px;opacity:.4;"></i></div>
        ยังไม่มีบันทึก — ถ่ายรูปแล้วกดบันทึกเพื่อเริ่มเก็บข้อมูล
      </div>
    </div>
  </section>
</div>

<div id="toast"><span class="dot"></span><span id="toastText">บันทึกแล้ว</span></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="https://docs.opencv.org/4.9.0/opencv.js"></script>
<script type="module">
(function(){
  "use strict";

  // API base URL for Production (Render) vs Dev (Vite proxy)
  var API_BASE = (typeof import.meta !== 'undefined' && import.meta.env && import.meta.env.VITE_API_URL) ? import.meta.env.VITE_API_URL : '';

  // ---------- state ----------
  var stream = null;
  var cvReady = false;
  var lastFrameCanvas = document.getElementById('captureCanvas');
  var overlayCanvas = document.getElementById('overlayCanvas');
  var video = document.getElementById('video');
  var history = []; // [{id, time, type, count, thumb}]
  var detectedCircles = []; // [{x, y, r, index}]
  var LOCAL_STORAGE_KEY = 'tube_counter_history_v1';

  var els = {
    cameraState: document.getElementById('cameraState'),
    captureControls: document.getElementById('captureControls'),
    btnCapture: document.getElementById('cameraCapture'),
    fileUpload: document.getElementById('fileUpload'),
    countChip: document.getElementById('countChip'),
    countChipText: document.getElementById('countChipText'),
    canvasTip: document.getElementById('canvasTip'),
    resultPanel: document.getElementById('resultPanel'),
    countInput: document.getElementById('countInput'),
    btnMinus: document.getElementById('btnMinus'),
    btnPlus: document.getElementById('btnPlus'),

    typeSelect: document.getElementById('typeSelect'),
    customTypeField: document.getElementById('customTypeField'),
    customType: document.getElementById('customType'),
    btnRetake: document.getElementById('btnRetake'),
    btnSave: document.getElementById('btnSave'),
    bannerSlot: document.getElementById('bannerSlot'),
    historyList: document.getElementById('historyList'),
    summaryChips: document.getElementById('summaryChips'),
    sumEntries: document.getElementById('sumEntries'),
    sumTotal: document.getElementById('sumTotal'),
    btnExportCsv: document.getElementById('btnExportCsv'),
    btnExportJson: document.getElementById('btnExportJson'),
    toast: document.getElementById('toast'),
    toastText: document.getElementById('toastText'),
    storageBadge: document.getElementById('storageBadge'),
    storageBadgeText: document.getElementById('storageBadgeText')
  };

  // ---------- opencv ready ----------
  function onOpenCvReady(){
    cvReady = true;
    console.log("OpenCV.js ready");
  }
  if (typeof cv !== 'undefined' && cv['onRuntimeInitialized'] !== undefined) {
    cv['onRuntimeInitialized'] = onOpenCvReady;
  } else {
    var waitCv = setInterval(function(){
      if (window.cv && cv.Mat) {
        clearInterval(waitCv);
        cv['onRuntimeInitialized'] = onOpenCvReady;
        cvReady = true;
      }
    }, 200);
  }

  // ---------- camera ----------
  function showBanner(msg, retryFn){
    els.bannerSlot.innerHTML = '';
    var b = document.createElement('div');
    b.className = 'banner';
    var span = document.createElement('div');
    span.textContent = msg;
    b.appendChild(span);
    if (retryFn){
      var btn = document.createElement('button');
      btn.textContent = 'ลองอีกครั้ง';
      btn.onclick = function(){ els.bannerSlot.innerHTML=''; retryFn(); };
      var wrap = document.createElement('div');
      wrap.style.width='100%';
      wrap.appendChild(btn);
      b.appendChild(wrap);
    }
    els.bannerSlot.appendChild(b);
  }

  function resumeLiveView(){
    els.resultPanel.style.display = 'none';
    els.countChip.style.display = 'none';
    els.canvasTip.style.display = 'none';
    overlayCanvas.style.display = 'none';
    els.captureControls.style.display = 'flex';
    // Reset viewfinder to placeholder
    els.cameraState.style.display = 'flex';
    els.cameraState.innerHTML =
      '<i data-lucide="camera" style="width:40px;height:40px;opacity:.3;"></i>' +
      '<span style="color:var(--text-muted);font-size:13px;margin-top:4px;">กด "ถ่ายรูป" หรือ "เลือกจากคลัง" ด้านล่าง</span>';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  // ---------- capture + detect ----------
  function detectAndRender(){
    els.captureControls.style.display = 'none';
    if (video) video.style.display = 'none';
    overlayCanvas.style.display = 'block';
    els.cameraState.style.display = 'flex';
    els.cameraState.innerHTML = '<div class="spinner"></div><span>กำลังส่งภาพไปให้ AI ตรวจจับ...</span>';

    serverDetect();
  }

  function serverDetect(){
    lastFrameCanvas.toBlob(function(blob){
      var formData = new FormData();
      formData.append('file', blob, 'frame.jpg');

      fetch(API_BASE + '/api/detect', {
        method: 'POST',
        body: formData
      })
      .then(function(res){ return res.json(); })
      .then(function(data){
        els.cameraState.style.display = 'none';
        if (data.success) {
          var img = new Image();
          img.onload = function(){
            overlayCanvas.width = img.width;
            overlayCanvas.height = img.height;
            var ctx = overlayCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
          };
          img.src = (API_BASE + data.annotated_image_url);

          els.countChip.style.display = 'flex';
          els.countChipText.textContent = 'นับได้ ' + data.count + ' หลอด';
          els.countInput.value = data.count;
          els.resultPanel.style.display = 'flex';
        }
      })
      .catch(function(err){
        els.cameraState.style.display = 'none';
        showBanner('การประมวลผลล้มเหลว: ' + err.message);
      });
    }, 'image/jpeg', 0.85);
  }

  // Auto-tune param2: try several values and pick the one whose count
  // is closest to the median of all non-zero results.
  function runHoughCirclesAuto(srcCanvas, outCanvas){
    var src = cv.imread(srcCanvas);
    var resized = new cv.Mat();
    var maxDim = Math.max(src.rows, src.cols);
    var scale = Math.min(1, 1000 / maxDim);
    var newW = Math.max(1, Math.round(src.cols * scale));
    var newH = Math.max(1, Math.round(src.rows * scale));
    cv.resize(src, resized, new cv.Size(newW, newH), 0, 0, cv.INTER_AREA);

    var gray = new cv.Mat();
    cv.cvtColor(resized, gray, cv.COLOR_RGBA2GRAY);
    var blurred = new cv.Mat();
    cv.medianBlur(gray, blurred, 5);
    var eq = new cv.Mat();
    cv.equalizeHist(blurred, eq);

    // Try multiple param2 values and collect results
    var candidates = [20, 25, 30, 35, 40, 45, 50, 55, 60];
    var results = [];
    for (var ti = 0; ti < candidates.length; ti++){
      var p2 = candidates[ti];
      var c = new cv.Mat();
      cv.HoughCircles(eq, c, cv.HOUGH_GRADIENT, 1.2, 25, 80, p2, 18, 55);
      results.push({ p2: p2, count: c.cols, mat: c });
    }

    // Find median count across non-zero results
    var nonZero = results.filter(function(r){ return r.count > 0; });
    var bestResult;
    if (nonZero.length === 0){
      bestResult = results[Math.floor(results.length / 2)];
    } else {
      var sorted = nonZero.slice().sort(function(a,b){ return a.count - b.count; });
      var median = sorted[Math.floor(sorted.length / 2)].count;
      // Pick the result closest to median (prefer slightly higher param2 = stricter)
      var best = nonZero[0], bestDiff = Math.abs(nonZero[0].count - median);
      for (var ri = 1; ri < nonZero.length; ri++){
        var diff = Math.abs(nonZero[ri].count - median);
        if (diff < bestDiff || (diff === bestDiff && nonZero[ri].p2 > best.p2)){
          bestDiff = diff; best = nonZero[ri];
        }
      }
      bestResult = best;
    }

    // Rebuild detectedCircles from chosen result
    detectedCircles = [];
    var chosen = bestResult.mat;
    for (var i = 0; i < chosen.cols; i++){
      detectedCircles.push({
        x: chosen.data32F[i*3],
        y: chosen.data32F[i*3+1],
        r: chosen.data32F[i*3+2],
        index: i + 1
      });
    }

    outCanvas.width = newW;
    outCanvas.height = newH;
    redrawCirclesOnCanvas(outCanvas, resized, detectedCircles);

    // cleanup
    src.delete(); resized.delete(); gray.delete(); blurred.delete(); eq.delete();
    results.forEach(function(r){ r.mat.delete(); });

    return detectedCircles.length;
  }

  function runHoughCircles(srcCanvas, outCanvas, param2){
    var src = cv.imread(srcCanvas);
    var resized = new cv.Mat();
    var maxDim = Math.max(src.rows, src.cols);
    var scale = Math.min(1, 1000 / maxDim);
    var newW = Math.max(1, Math.round(src.cols * scale));
    var newH = Math.max(1, Math.round(src.rows * scale));
    cv.resize(src, resized, new cv.Size(newW, newH), 0, 0, cv.INTER_AREA);

    var gray = new cv.Mat();
    cv.cvtColor(resized, gray, cv.COLOR_RGBA2GRAY);
    var blurred = new cv.Mat();
    cv.medianBlur(gray, blurred, 5);
    var eq = new cv.Mat();
    cv.equalizeHist(blurred, eq);

    var circles = new cv.Mat();
    cv.HoughCircles(eq, circles, cv.HOUGH_GRADIENT, 1.2, 25, 80, param2, 18, 55);

    detectedCircles = [];
    var count = circles.cols;
    for (var i = 0; i < circles.cols; i++){
      var x = circles.data32F[i*3];
      var y = circles.data32F[i*3+1];
      var r = circles.data32F[i*3+2];
      detectedCircles.push({x: x, y: y, r: r, index: i + 1});
    }

    outCanvas.width = newW;
    outCanvas.height = newH;
    redrawCirclesOnCanvas(outCanvas, resized, detectedCircles);

    src.delete(); resized.delete(); gray.delete(); blurred.delete();
    eq.delete(); circles.delete();
    return count;
  }

  function redrawCirclesOnCanvas(outCanvas, baseMat, circlesList){
    var display = baseMat.clone();
    for (var i = 0; i < circlesList.length; i++){
      var c = circlesList[i];
      cv.circle(display, new cv.Point(c.x, c.y), c.r, new cv.Scalar(74, 222, 128, 255), 2);
      cv.circle(display, new cv.Point(c.x, c.y), 2, new cv.Scalar(196, 69, 58, 255), 3);
      cv.putText(display, String(i + 1), new cv.Point(c.x - 8, c.y + 4),
                 cv.FONT_HERSHEY_SIMPLEX, 0.4, new cv.Scalar(255, 255, 0, 255), 1);
    }
    cv.putText(display, "Count: " + circlesList.length, new cv.Point(20, 40),
               cv.FONT_HERSHEY_SIMPLEX, 1.0, new cv.Scalar(196, 69, 58, 255), 3);
    cv.imshow(outCanvas, display);
    display.delete();
  }


  // ---------- image load helper ----------
  // MAX pixel dimension before passing to OpenCV (phone cameras = 12–48MP → too slow without this)
  var MAX_IMG_DIM = 800;

  // HEIC/HEIF mime types + filename extensions browser usually can't decode
  function isHeic(file){
    if (file.type === 'image/heic' || file.type === 'image/heif') return true;
    var name = (file.name || '').toLowerCase();
    return name.endsWith('.heic') || name.endsWith('.heif');
  }

  function showCameraState(html){
    els.cameraState.style.display = 'flex';
    els.cameraState.innerHTML = html;
  }

  function restoreUI(){
    els.cameraState.style.display = 'none';
    els.captureControls.style.display = 'flex';
  }

  function loadImageFromFile(file){
    if (!file) return;

    // ── Show loading immediately ────────────────────────────────────────────
    els.captureControls.style.display = 'none';
    if (video) video.style.display = 'none';
    overlayCanvas.style.display = 'none';
    showCameraState('<div class="spinner"></div><span>กำลังโหลดรูปภาพ...</span>');

    // ── HEIC/HEIF → แปลงเป็น JPEG อัตโนมัติ ────────────────────────────────
    if (isHeic(file)){
      showCameraState('<div class="spinner"></div><span>กำลังแปลง HEIC → JPEG อัตโนมัติ...</span>');
      if (typeof heic2any === 'undefined'){
        showCameraState(
          '<div style="padding:16px;text-align:center;"><div style="font-size:26px;">⚠️</div>' +
          'โหลด heic2any ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต<br><br>' +
          '<button onclick="restoreUI()" style="padding:8px 20px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;">ลองใหม่</button></div>'
        );
        return;
      }
      heic2any({ blob: file, toType: 'image/jpeg', quality: 0.88 })
        .then(function(jpegBlob){
          var blob = Array.isArray(jpegBlob) ? jpegBlob[0] : jpegBlob;
          loadBlobToCanvas(blob);
        })
        .catch(function(){
          showCameraState(
            '<div style="padding:16px;text-align:center;"><div style="font-size:26px;">⚠️</div>' +
            'แปลง HEIC ไม่สำเร็จ<br>' +
            '<span style="font-size:12px;color:var(--text-muted);">ลองตั้งกล้อง iPhone → Most Compatible แล้วถ่ายใหม่</span><br><br>' +
            '<button onclick="restoreUI()" style="padding:8px 20px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;">ลองใหม่</button></div>'
          );
        });
      return;
    }

    if (!file.type.startsWith('image/')) return;
    loadBlobToCanvas(file);
  }

  // แยก logic วาดภาพลง canvas ออกมา — ใช้ร่วมกันทั้ง JPEG ปกติ และ HEIC-converted
  function loadBlobToCanvas(blob){
    var url;
    try { url = URL.createObjectURL(blob); } catch(e){ restoreUI(); return; }

    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h){ URL.revokeObjectURL(url); restoreUI(); return; }

      // Scale down large phone photos before OpenCV (keeps accuracy, much faster)
      var scale = Math.min(1, MAX_IMG_DIM / Math.max(w, h));
      var tw = Math.round(w * scale);
      var th = Math.round(h * scale);

      showCameraState('<div class="spinner"></div><span>กำลังประมวลผล' +
        (scale < 1 ? ' (ปรับขนาด ' + tw + '\u00d7' + th + 'px)' : '') + '...</span>');

      lastFrameCanvas.width  = tw;
      lastFrameCanvas.height = th;
      var ctx = lastFrameCanvas.getContext('2d');
      ctx.drawImage(img, 0, 0, tw, th);

      URL.revokeObjectURL(url);
      detectAndRender();
    };
    img.onerror = function(){
      URL.revokeObjectURL(url);
      showCameraState(
        '<div style="padding:16px;text-align:center;">' +
        '<div style="font-size:26px;">⚠️</div>' +
        'Browser เปิดไฟล์นี้ไม่ได้<br>' +
        '<span style="font-size:12px;color:var(--text-muted);">ลองแปลงเป็น JPEG ก่อนส่งมา</span><br><br>' +
        '<button onclick="restoreUI()" style="padding:8px 20px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;">ลองใหม่</button>' +
        '</div>'
      );
    };
    img.src = url;
  }


  // Handle file upload button
  els.fileUpload.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (file) {
      loadImageFromFile(file);
      els.fileUpload.value = ''; // reset so same file can be selected again
    }
  });

  // Drag & Drop on viewfinder
  var viewfinderEl = document.getElementById('viewfinder');
  viewfinderEl.addEventListener('dragover', function(e){
    e.preventDefault();
    viewfinderEl.style.outline = '2px dashed var(--accent)';
  });
  viewfinderEl.addEventListener('dragleave', function(e){
    e.preventDefault();
    viewfinderEl.style.outline = 'none';
  });
  viewfinderEl.addEventListener('drop', function(e){
    e.preventDefault();
    viewfinderEl.style.outline = 'none';
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]){
      loadImageFromFile(e.dataTransfer.files[0]);
    }
  });

  // Paste image from clipboard (Ctrl+V)
  window.addEventListener('paste', function(e){
    var items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (var i = 0; i < items.length; i++){
      if (items[i].type.indexOf('image') !== -1){
        var file = items[i].getAsFile();
        loadImageFromFile(file);
        break;
      }
    }
  });

  // ---------- form helpers ----------
  function currentTypeLabel(){
    if (els.typeSelect.value === 'อื่นๆ'){
      return (els.customType.value || '').trim() || 'อื่นๆ';
    }
    return els.typeSelect.value;
  }

  function showToast(msg){
    els.toastText.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      els.toast.classList.remove('show');
    }, 2600);
  }

  // ---------- history & JSON sync ----------
  function loadLocalHistory(){
    try {
      var saved = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch(e){}
    return [];
  }

  function saveLocalHistory(list){
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(list));
    } catch(e){}
  }

  function syncHistory(){
    fetch(API_BASE + '/api/records')
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (Array.isArray(data) && data.length > 0) {
          history = data.map(function(r){
            return {
              id: r.id,
              time: r.time_str || '',
              type: r.tube_type || 'ทั่วไป',
              count: r.count || 0,
              thumb: r.thumb_url || r.image_url || ''
            };
          });
          saveLocalHistory(history);
        } else {
          history = loadLocalHistory();
        }
        renderHistory();
        els.storageBadgeText.textContent = 'JSON Store (' + history.length + ')';
      })
      .catch(function(){
        // Offline or Firebase static hosting without backend active
        history = loadLocalHistory();
        renderHistory();
        els.storageBadgeText.textContent = 'Local JSON (' + history.length + ')';
      });
  }

  function renderHistory(){
    if (history.length === 0){
      els.summaryChips.style.display = 'none';
      els.historyList.innerHTML = '<div class="empty-state"><div class="icon">&#9678;</div>ยังไม่มีบันทึก — ถ่ายรูปแล้วกดบันทึกเพื่อเริ่มเก็บข้อมูล</div>';
      return;
    }
    els.summaryChips.style.display = 'flex';
    els.sumEntries.textContent = history.length;
    els.sumTotal.textContent = history.reduce(function(a,e){return a + (e.count || 0);}, 0);

    els.historyList.innerHTML = '';
    for (var i = history.length - 1; i >= 0; i--){
      (function(entry){
        var row = document.createElement('div');
        row.className = 'history-row';

        var img = document.createElement('img');
        img.src = entry.thumb || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="%23ccc"><rect width="48" height="48"/></svg>';
        img.alt = '';

        var meta = document.createElement('div');
        meta.className = 'meta';
        var typeEl = document.createElement('div');
        typeEl.className = 'type';
        typeEl.textContent = entry.type;
        var timeEl = document.createElement('div');
        timeEl.className = 'time';
        timeEl.textContent = entry.time;
        meta.appendChild(typeEl);
        meta.appendChild(timeEl);

        var countEl = document.createElement('div');
        countEl.className = 'count-badge';
        countEl.textContent = entry.count;

        var delBtn = document.createElement('button');
        delBtn.className = 'btn-danger-ghost';
        delBtn.textContent = 'ลบ';
        delBtn.onclick = function(){
          if (entry.id) {
            fetch(API_BASE + '/api/records/' + entry.id, { method: 'DELETE' }).catch(function(){});
          }
          history = history.filter(function(e){ return e.id !== entry.id; });
          saveLocalHistory(history);
          renderHistory();
        };

        row.appendChild(img);
        row.appendChild(meta);
        row.appendChild(countEl);
        row.appendChild(delBtn);
        els.historyList.appendChild(row);
      })(history[i]);
    }
  }

  function saveEntry(){
    var count = parseInt(els.countInput.value, 10);
    if (isNaN(count) || count < 0){
      els.countInput.focus();
      return;
    }
    if (els.typeSelect.value === 'อื่นๆ' && !els.customType.value.trim()){
      els.customType.focus();
      return;
    }

    var thumbCanvas = document.createElement('canvas');
    var tw = 160, th = Math.round(160 * (lastFrameCanvas.height / (lastFrameCanvas.width || 1)));
    thumbCanvas.width = tw; thumbCanvas.height = th;
    thumbCanvas.getContext('2d').drawImage(overlayCanvas.width ? overlayCanvas : lastFrameCanvas, 0, 0, tw, th);
    var thumbDataUrl = thumbCanvas.toDataURL('image/jpeg', 0.7);

    var now = new Date();
    var timeStr = now.toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'});
    var typeStr = currentTypeLabel();
    var recordId = String(Date.now());

    var newEntry = {
      id: recordId,
      time: timeStr,
      type: typeStr,
      count: count,
      thumb: thumbDataUrl
    };

    // Save to LocalStorage
    history.push(newEntry);
    saveLocalHistory(history);
    renderHistory();

    // Post to backend records.json
    fetch(API_BASE + '/api/records', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        id: recordId,
        time_str: timeStr,
        tube_type: typeStr,
        count: count,
        thumb_url: thumbDataUrl
      })
    }).catch(function(err){
      console.log("Offline or saved locally:", err);
    });

    showToast('บันทึกข้อมูลเรียบร้อย');
    resumeLiveView();
  }

  function exportCsv(){
    if (history.length === 0){
      showToast('ยังไม่มีข้อมูลให้ส่งออก');
      return;
    }
    var rows = [['ID', 'เวลา', 'ประเภท', 'จำนวน']];
    history.forEach(function(e){ rows.push([e.id, e.time, e.type, e.count]); });
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell).replace(/"/g,'""');
        return /[",\n]/.test(s) ? '"'+s+'"' : s;
      }).join(',');
    }).join('\r\n');
    downloadBlob(csv, 'tube-count-' + Date.now() + '.csv', 'text/csv;charset=utf-8;');
  }

  function exportJson(){
    if (history.length === 0){
      showToast('ยังไม่มีข้อมูลให้ส่งออก');
      return;
    }
    var jsonStr = JSON.stringify(history, null, 2);
    downloadBlob(jsonStr, 'tube-count-' + Date.now() + '.json', 'application/json;charset=utf-8;');
  }

  function downloadBlob(content, filename, mimeType){
    var blob = new Blob(['\uFEFF' + content], {type: mimeType});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- wire up events ----------
  // Native camera capture (takes photo via phone camera app)
  document.getElementById('cameraCapture').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (file) {
      loadImageFromFile(file);
      e.target.value = '';
    }
  });

  els.btnRetake.addEventListener('click', resumeLiveView);
  els.btnSave.addEventListener('click', saveEntry);

  els.btnMinus.addEventListener('click', function(){
    var v = Math.max(0, (parseInt(els.countInput.value,10)||0) - 1);
    els.countInput.value = v;
  });
  els.btnPlus.addEventListener('click', function(){
    var v = (parseInt(els.countInput.value,10)||0) + 1;
    els.countInput.value = v;
  });



  els.typeSelect.addEventListener('change', function(){
    els.customTypeField.style.display = (els.typeSelect.value === 'อื่นๆ') ? 'flex' : 'none';
  });

  els.btnExportCsv.addEventListener('click', exportCsv);
  els.btnExportJson.addEventListener('click', exportJson);

  window.addEventListener('beforeunload', function(){
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); }
  });

  // ---------- init ----------
  if (typeof lucide !== 'undefined') lucide.createIcons();
  syncHistory();
})();
</script>
